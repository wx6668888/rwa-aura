# 用于子域 api.rwaprotocol.dpdns.org 反代到本机 Node（如 3001）时的参考片段。
# 中继曾长期 await tx.wait()，易触发 60s 默认超时 → 504 → 浏览器误报 CORS。
# 代码已改为广播后即返回 txHash；仍建议拉长超时以覆盖慢 RPC / 大 JSON。

server {
    listen 443 ssl http2;
    server_name api.rwaprotocol.dpdns.org;

    # ssl_certificate ...（宝塔或 certbot）

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
