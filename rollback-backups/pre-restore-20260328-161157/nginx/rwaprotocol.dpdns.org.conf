server {
    listen 80;
    server_name rwaprotocol.dpdns.org;
    return 301 https://rwa.lat$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name rwaprotocol.dpdns.org;

    ssl_certificate /www/server/panel/vhost/cert/rwaprotocol.dpdns.org/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/rwaprotocol.dpdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://rwa.lat$request_uri;
}
