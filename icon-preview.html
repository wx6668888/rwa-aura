<!DOCTYPE html>
<html>
<head>
    <title>RWA Icon</title>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #f0f0f0;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        svg {
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border-radius: 50%;
        }
        button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 16px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
                </linearGradient>
            </defs>
            <circle cx="256" cy="256" r="240" fill="url(#grad1)"/>
            <text x="256" y="300" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="white" text-anchor="middle">RWA</text>
            <circle cx="256" cy="256" r="200" fill="none" stroke="white" stroke-width="4" opacity="0.3"/>
            <circle cx="256" cy="256" r="220" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>
        </svg>
        <br>
        <button onclick="downloadPNG()">下载PNG</button>
    </div>
    
    <script>
        function downloadPNG() {
            const svg = document.querySelector('svg');
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const data = new XMLSerializer().serializeToString(svg);
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'rwa-icon.png';
                    a.click();
                });
            };
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(data)));
        }
    </script>
</body>
</html>
