# RWA Protocol Nginx配置
# 域名: rwa.lat

server {
    listen 443 ssl http2;
    server_name rwa.lat www.rwa.lat;
    
    # SSL证书（宝塔自动管理）
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;
    
    # 前端
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 聊天服务（独立端口 3002）：必须在通用 /api 之前，否则 /api/chat 会落到主后端 3001 返回 404，
    # 浏览器会得到非预期 JSON → signMessage(undefined) → ethers INVALID_ARGUMENT。
    location ^~ /api/chat/ {
        proxy_pass http://127.0.0.1:3002/api/chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /chat-ws/ {
        proxy_pass http://127.0.0.1:3002/chat-ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # 后端 API（含 gasless 中继 /api/meta-stake-*）：务必保留；前端应走同源 /api，勿强依赖 api.* 子域以免 502 无 CORS 头
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    # Next.js 静态资源：由 Nginx 直接读 .next/static，避免仅依赖 Node 进程内清单
    # （构建后若未及时重启 PM2，或大体积 CSS chunk 与进程启动时扫描不一致时，走 Node 可能对部分文件 404，整站会像「没加载 CSS」）
    # 路径需与 PM2 的 frontend 目录一致；换目录部署时请同步修改此处
    location ^~ /_next/static/ {
        alias /www/wwwroot/rwaprotocol.dpdns.org/frontend/.next/static/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # dotLottie 动画：文件可用 ?v= 版本号控制更新，适合长期缓存
    location ~* \.lottie$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其它静态资源（不含 .js，避免误伤 Next 非静态路径）
    location ~* \.(jpg|jpeg|png|gif|ico|css|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
